<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Chat KaslyAI</title>
  <link rel="manifest" href="chat-manifest.json">
  <meta name="theme-color" content="#0F766E">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Sora:wght@700;800&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #F5F7F6;
      font-family: 'Plus Jakarta Sans', sans-serif;
    }
    #installBar {
      display: none;
      background: #0F766E;
      color: #ffffff;
      padding: 10px 16px;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      z-index: 9999;
      box-shadow: 0 2px 8px rgba(0,0,0,0.15);
    }
    #installBar .bar-text {
      font-size: 13px;
      font-weight: 600;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    #installBar .btn-bar-install {
      background: #ffffff;
      color: #0F766E;
      border: none;
      border-radius: 8px;
      padding: 6px 14px;
      font-size: 12px;
      font-weight: 700;
      cursor: pointer;
      flex-shrink: 0;
    }
    #appFrame {
      width: 100%;
      height: 100%;
      border: none;
      display: block;
    }
  </style>
</head>
<body>

  <div id="installBar">
    <div class="bar-text">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
      <span>Pasang Ikon Chat ke Layar Utama</span>
    </div>
    <button type="button" class="btn-bar-install" onclick="triggerInstallChat()">Instal</button>
  </div>

  <iframe id="appFrame" src="./?shortcut=chat" allow="camera; microphone; geolocation"></iframe>

  <script>
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('sw.js').catch(err => console.warn(err));
    }

    let chatDeferredPrompt = null;
    const isStandalone = window.matchMedia('(display-mode: standalone)').matches || window.navigator.standalone === true;

    window.addEventListener('beforeinstallprompt', (e) => {
      e.preventDefault();
      chatDeferredPrompt = e;
      if (!isStandalone) {
        const bar = document.getElementById('installBar');
        if (bar) bar.style.display = 'flex';
      }
    });

    window.addEventListener('appinstalled', () => {
      chatDeferredPrompt = null;
      const bar = document.getElementById('installBar');
      if (bar) bar.style.display = 'none';
    });

    async function triggerInstallChat() {
      if (chatDeferredPrompt) {
        chatDeferredPrompt.prompt();
        const { outcome } = await chatDeferredPrompt.userChoice;
        if (outcome === 'accepted') {
          chatDeferredPrompt = null;
          const bar = document.getElementById('installBar');
          if (bar) bar.style.display = 'none';
        }
      }
    }
  </script>
</body>
</html>
