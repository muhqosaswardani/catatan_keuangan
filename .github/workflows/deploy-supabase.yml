name: Deploy Supabase

on:
  push:
    branches: [main]
    paths:
      - 'supabase/functions/**'
  workflow_dispatch:
    inputs:
      run_migration:
        description: 'Jalankan migration database? (ketik: yes)'
        required: false
        default: 'no'

jobs:
  deploy-functions:
    if: github.event_name == 'push' || github.event.inputs.run_migration != 'yes'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Deploy Edge Functions
        run: supabase functions deploy --project-ref qdoduglbejcazjufvfkf
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}

  migrate-database:
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.run_migration == 'yes'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Push Database Migration
        run: supabase db push --project-ref qdoduglbejcazjufvfkf
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
